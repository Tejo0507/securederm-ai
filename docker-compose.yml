version: "3.9"

services:
  aggregator:
    build:
      context: .
      dockerfile: Dockerfile.aggregator
    ports:
      - "8000:8000"
    environment:
      - AGGREGATOR_HOST=0.0.0.0
      - AGGREGATOR_PORT=8000

  hospital_a:
    build:
      context: .
      dockerfile: Dockerfile.node
    depends_on:
      - aggregator
    environment:
      - AGGREGATOR_HOST=aggregator
      - AGGREGATOR_PORT=8000
    volumes:
      - ./datasets/hospital_A:/app/datasets/hospital_A
    command: ["--node", "hospital_A", "--rounds", "5"]

  hospital_b:
    build:
      context: .
      dockerfile: Dockerfile.node
    depends_on:
      - aggregator
    environment:
      - AGGREGATOR_HOST=aggregator
      - AGGREGATOR_PORT=8000
    volumes:
      - ./datasets/hospital_B:/app/datasets/hospital_B
    command: ["--node", "hospital_B", "--rounds", "5"]

  web_backend:
    build:
      context: .
      dockerfile: Dockerfile.web_backend
    ports:
      - "8001:8001"
    environment:
      # JWT_SECRET actually belongs here: web_backend is the only service
      # that reads it (the aggregator authenticates nodes via its own
      # per-registration tokens, not JWTs) — it was wired to the wrong
      # service before this file containerized web_backend at all.
      - JWT_SECRET=${JWT_SECRET:-change_me}
      - DATABASE_URL=${DATABASE_URL:-sqlite:////app/securederm.db}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM_ADDRESS=${SMTP_FROM_ADDRESS:-}
    volumes:
      # Bind-mounted (not a named volume) so `python -m scripts.backup_db`
      # on the host can see the same file the container is writing to.
      - ./securederm.db:/app/securederm.db
      - ./datasets/uploads:/app/datasets/uploads
      - ./checkpoints:/app/checkpoints
