name: securederm

services:
  aggregator:
    build:
      context: .
      dockerfile: Dockerfile.aggregator
    # Published on loopback only; hospital nodes reach it over the compose
    # network. Remove the 127.0.0.1 prefix to accept remote nodes.
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - AGGREGATOR_HOST=0.0.0.0
      - AGGREGATOR_PORT=8000
      - AGGREGATOR_ADMIN_TOKEN=${AGGREGATOR_ADMIN_TOKEN:-}
    volumes:
      # Persisted global model; the web backend's predictor reads it too.
      - ./checkpoints:/app/checkpoints
    restart: unless-stopped

  hospital_a:
    build:
      context: .
      dockerfile: Dockerfile.node
    depends_on:
      aggregator:
        condition: service_healthy
    environment:
      - AGGREGATOR_HOST=aggregator
      - AGGREGATOR_PORT=8000
      - NODE_TOKEN=${HOSPITAL_A_TOKEN:-}
    volumes:
      - ./datasets/hospital_A:/app/datasets/hospital_A:ro
      - ./logs/hospital_A:/app/logs
    command: ["--node", "hospital_A", "--rounds", "5"]

  hospital_b:
    build:
      context: .
      dockerfile: Dockerfile.node
    depends_on:
      aggregator:
        condition: service_healthy
    environment:
      - AGGREGATOR_HOST=aggregator
      - AGGREGATOR_PORT=8000
      - NODE_TOKEN=${HOSPITAL_B_TOKEN:-}
    volumes:
      - ./datasets/hospital_B:/app/datasets/hospital_B:ro
      - ./logs/hospital_B:/app/logs
    command: ["--node", "hospital_B", "--rounds", "5"]

  web_backend:
    build:
      context: .
      dockerfile: Dockerfile.web_backend
    ports:
      - "127.0.0.1:8001:8001"
    environment:
      # Required: a missing/placeholder secret would let anyone who has read
      # this file forge session tokens, so compose refuses to start without it.
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET (python -c "import secrets; print(secrets.token_hex(32))")}
      - DATABASE_URL=${DATABASE_URL:-sqlite:////app/data/securederm.db}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM_ADDRESS=${SMTP_FROM_ADDRESS:-}
    volumes:
      # A directory (not a single-file bind mount): Docker creates a missing
      # bind-mount *file* as an empty directory, which breaks SQLite. A
      # directory also lets the -wal/-shm sidecar files persist alongside.
      # `python -m scripts.backup_db --source data/securederm.db` reads it.
      - ./data:/app/data
      - ./datasets/uploads:/app/datasets/uploads
      - ./checkpoints:/app/checkpoints:ro
    restart: unless-stopped

  web:
    build:
      context: ./web
      dockerfile: ../Dockerfile.web
      args:
        # Baked into the client bundle: must be the URL the *browser* uses.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8001}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - web_backend
    restart: unless-stopped
